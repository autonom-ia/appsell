[project]
name = "appsell-api"
version = "0.1.0"
description = "Private domain API for Autonom.ia Sell"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.15,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.40,<2",
  "fastapi>=0.116,<1",
  "greenlet>=3.1,<4",
  "httpx>=0.28,<1",
  "pillow>=12.3,<13",
  "psycopg[binary]>=3.2,<4",
  "pikepdf>=9.11,<11",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.40,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.16,<2",
  "pip-audit>=2.9,<3",
  "pypdf>=6.15,<7",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.0,<2",
  "reportlab==4.4.9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appsell_api"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["appsell_api"]
