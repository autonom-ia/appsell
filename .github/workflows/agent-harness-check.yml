name: Harness CI

on:
  pull_request:
    branches: [main, master, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: harness-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harness-ci:
    name: Harness CI
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      HARNESS_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      HARNESS_CI_HEAD_SHA: ${{ github.sha }}
      HARNESS_CI_REQUIRE_TOOLS: "true"
      HARNESS_LIVE_EVAL: ${{ vars.HARNESS_LIVE_EVAL || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan risk-aware checks
        id: plan
        continue-on-error: true
        shell: bash
        run: bash scripts/harness-ci.sh --phase plan

      - name: Install pinned core tools
        id: install_core
        continue-on-error: true
        shell: bash
        run: |
          bash scripts/install-ci-tools.sh --group core --dest "$RUNNER_TEMP/harness-tools"
          echo "$RUNNER_TEMP/harness-tools" >> "$GITHUB_PATH"

      - name: Run core quality checks
        id: core
        continue-on-error: true
        shell: bash
        run: bash scripts/harness-ci.sh --phase core

      - name: Run project checks
        id: project
        continue-on-error: true
        shell: bash
        run: bash scripts/harness-ci.sh --phase project --project-scope full

      - name: Install pinned security scanners
        id: install_security
        continue-on-error: true
        shell: bash
        run: |
          bash scripts/install-ci-tools.sh --group security --dest "$RUNNER_TEMP/harness-tools"
          echo "$RUNNER_TEMP/harness-tools" >> "$GITHUB_PATH"

      - name: Scan changed history with Gitleaks
        id: gitleaks
        continue-on-error: true
        shell: bash
        run: bash scripts/harness-ci.sh --phase gitleaks

      - name: Scan dependencies with OSV
        id: osv
        if: always() && steps.plan.outputs.osv_scan == 'true'
        continue-on-error: true
        shell: bash
        run: bash scripts/harness-ci.sh --phase osv

      - name: Install pinned Promptfoo
        id: install_promptfoo
        if: always() && steps.plan.outputs.prompt_eval == 'true'
        continue-on-error: true
        shell: bash
        run: |
          bash scripts/install-ci-tools.sh --group eval --dest "$RUNNER_TEMP/harness-tools"
          echo "$RUNNER_TEMP/harness-tools" >> "$GITHUB_PATH"

      - name: Evaluate changed prompts and agents
        id: promptfoo
        if: always() && steps.plan.outputs.prompt_eval == 'true'
        continue-on-error: true
        shell: bash
        run: bash scripts/harness-ci.sh --phase promptfoo

      - name: Write sanitized job summary and enforce result
        if: always()
        shell: bash
        env:
          HARNESS_CI_EXTERNAL_FAILURE: ${{ steps.plan.outcome == 'failure' || steps.install_core.outcome == 'failure' || steps.core.outcome == 'failure' || steps.project.outcome == 'failure' || steps.install_security.outcome == 'failure' || steps.gitleaks.outcome == 'failure' || steps.osv.outcome == 'failure' || steps.install_promptfoo.outcome == 'failure' || steps.promptfoo.outcome == 'failure' }}
        run: bash scripts/harness-ci.sh --phase summary

      - name: Upload sanitized failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-ci-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .harness-ci-artifacts/*.txt
          if-no-files-found: warn
          retention-days: 7
