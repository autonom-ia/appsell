name: EasyPanel native images

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Expensive rehearsal to run manually
        required: true
        default: all
        type: choice
        options: [all, images, bootstrap, backup]
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.sha }}

concurrency:
  group: easypanel-native-rehearsal-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'images') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: deploy/easypanel-native/Dockerfile.web
          - name: api
            dockerfile: deploy/easypanel-native/Dockerfile.api
          - name: bootstrap
            dockerfile: deploy/easypanel-native/Dockerfile.bootstrap
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Validate exact source and scripts
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bash -n deploy/easypanel-native/bootstrap-native-demo.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: autonomia-sell-native-${{ matrix.name }}:${{ env.SOURCE_SHA }}
          build-args: |
            GIT_SHA=${{ env.SOURCE_SHA }}
          cache-from: type=gha,scope=easypanel-native-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=easypanel-native-${{ matrix.name }}

  bootstrap-rehearsal:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'bootstrap') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Validate exact source and scripts
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bash -n deploy/easypanel-native/bootstrap-native-demo.sh
          bash -n deploy/easypanel-native/test-bootstrap-native.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/easypanel-native/Dockerfile.bootstrap
          platforms: linux/amd64
          push: false
          load: true
          tags: autonomia-sell-native-bootstrap:rehearsal
          build-args: |
            GIT_SHA=${{ env.SOURCE_SHA }}
          cache-from: type=gha,scope=easypanel-native-bootstrap
      - name: Rehearse native bootstrap against disposable PostgreSQL
        run: |
          BOOTSTRAP_IMAGE=autonomia-sell-native-bootstrap:rehearsal \
            bash deploy/easypanel-native/test-bootstrap-native.sh

  backup-restore-rehearsal:
    if: ${{ github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'backup' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Validate exact source and scripts
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bash -n deploy/easypanel-native/backup/lib-backup.sh
          bash -n deploy/easypanel-native/backup/backup-native.sh
          bash -n deploy/easypanel-native/backup/restore-native.sh
          bash -n deploy/easypanel-native/backup/test-backup-native.sh
          bash -n deploy/easypanel-native/backup/test-entrypoints-native.sh
      - name: Rehearse backup, encrypt, off-host, restore and compare (library)
        run: |
          gpg --version | head -1
          bash deploy/easypanel-native/backup/test-backup-native.sh
      - name: Rehearse the backup and restore entrypoints as real processes
        run: |
          bash deploy/easypanel-native/backup/test-entrypoints-native.sh
