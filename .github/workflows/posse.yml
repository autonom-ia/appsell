name: Posse de pastas

# #552: o PR que mexe em arquivo de uma trilha precisa do rótulo dela
# (docs/programa/posse.json). Workflow próprio, e não passo do ci-gate, porque
# trocar rótulo não pode rodar as suítes de novo nem produzir um ci-gate verde
# sem elas. Consultivo até o ruleset exigir o check `posse` (OK do Rodrigo).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: appsell-posse-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  posse:
    name: posse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout with history for the PR diff
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check folder ownership against the trilha labels
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          files="$RUNNER_TEMP/posse-files.bin"
          # -z: sem aspas nem octal em nome não ASCII.
          git diff -z --name-only --no-renames "$BASE_SHA...$HEAD_SHA" > "$files"
          # Manifesto e checker vêm da base: o PR não pode afrouxar a regra
          # que o julga. Só na criação (base ainda sem os dois) vale a do PR.
          checker="$RUNNER_TEMP/check_ownership.py"
          manifest="$RUNNER_TEMP/posse.json"
          if git cat-file -e "$BASE_SHA:scripts/ci/check_ownership.py" \
             && git cat-file -e "$BASE_SHA:docs/programa/posse.json"; then
            git show "$BASE_SHA:scripts/ci/check_ownership.py" > "$checker"
            git show "$BASE_SHA:docs/programa/posse.json" > "$manifest"
          else
            echo "::notice::posse: base sem o check; usando o do PR (só no PR que o cria)"
            cp scripts/ci/check_ownership.py "$checker"
            cp docs/programa/posse.json "$manifest"
          fi
          python3 -I "$checker" --manifest "$manifest" --files "$files" --labels "$LABELS"
