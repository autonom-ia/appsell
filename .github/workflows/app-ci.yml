name: App CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  capacity-100-tenants:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install isolated-test Redis binary
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo systemctl stop redis-server || true
          redis-server --version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.13"
      - run: uv sync --project apps/api --frozen
      - name: Prove capacity scanner redacts console output
        run: ./scripts/test-capacity-artifact-scan.sh
      - name: Fault-inject PostgreSQL restart after Compose health
        run: ./scripts/test-capacity-postgres-startup.sh
      - name: Certify 100 admins and 1,000 buyers on disposable Local/CI infrastructure
        run: ./scripts/test-capacity-100-tenants.sh
      - name: Scan capacity evidence before upload
        id: capacity-evidence-scan
        if: always()
        run: |
          python3 scripts/assert_capacity_artifact_safe.py --self-test
          files=()
          for candidate in \
            tmp/capacity-100.json \
            tmp/capacity-100.md \
            tmp/capacity-100-postgres-startup.json \
            tmp/capacity-postgres-fault.json; do
            if [[ -f "$candidate" ]]; then files+=("$candidate"); fi
          done
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No capacity evidence was produced" >&2
            exit 1
          fi
          python3 scripts/assert_capacity_artifact_safe.py "${files[@]}"
      - name: Upload capacity evidence
        if: always() && steps.capacity-evidence-scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capacity-100-admins-1000-buyers-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/capacity-100.json
            tmp/capacity-100.md
            tmp/capacity-100-postgres-startup.json
            tmp/capacity-postgres-fault.json
          if-no-files-found: error
          retention-days: 30

  storage-vertical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.13"
      - run: uv sync --project apps/api --frozen
      - name: Real S3 upload, worker, publication, and authorized read
        run: ./scripts/test-storage-vertical.sh

  postgres-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install isolated-test Redis binary
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo systemctl stop redis-server || true
          redis-server --version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.13"
      - run: uv sync --project apps/api --frozen
      - run: uv run --project apps/api ruff format --check apps/api
      - run: uv run --project apps/api ruff check apps/api
      - run: uv run --project apps/api mypy --config-file apps/api/pyproject.toml apps/api/src apps/api/tests
      - run: uv run --project apps/api pip-audit --local
      - run: >-
          uv run --project apps/api pytest
          apps/api/tests/test_config.py
          apps/api/tests/test_health.py
          apps/api/tests/test_capacity_telemetry.py
          apps/api/tests/test_db_pool_budget.py
      - run: pnpm exec playwright install --with-deps chromium
      - run: ./scripts/test-postgres-foundation.sh

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install isolated-test Redis binary
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo systemctl stop redis-server || true
          redis-server --version
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - run: pnpm test:e2e:production
