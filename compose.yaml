name: appsell-local

services:
  api:
    build:
      context: ./apps/api
    environment:
      APPSELL_API_ENVIRONMENT: local
      APPSELL_API_DATABASE_URL: postgresql+asyncpg://appsell_runtime:${APPSELL_RUNTIME_PASSWORD:?set in local env}@postgres:5432/appsell
      APPSELL_API_INTERNAL_ISSUER: ${APPSELL_INTERNAL_ISSUER:-}
      APPSELL_API_INTERNAL_AUDIENCE: ${APPSELL_INTERNAL_AUDIENCE:-}
      APPSELL_API_IDENTITY_ISSUER: ${APPSELL_IDENTITY_ISSUER:-}
      APPSELL_API_INTERNAL_HMAC_KEYRING_B64_JSON: ${APPSELL_INTERNAL_HMAC_KEYRING_B64_JSON:-}
      APPSELL_API_CONTEXT_HMAC_KEY_B64: ${APPSELL_API_CONTEXT_HMAC_KEY_B64:-}
      APPSELL_API_SERVICE_CREDENTIAL_B64: ${APPSELL_SERVICE_CREDENTIAL_B64:-}
    ports:
      - "127.0.0.1:${APPSELL_API_PORT:-58000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:16.9-alpine@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${APPSELL_POSTGRES_SUPERUSER_PASSWORD:?set in local env}
      POSTGRES_DB: appsell
      APPSELL_MIGRATOR_PASSWORD: ${APPSELL_MIGRATOR_PASSWORD:?set in local env}
      APPSELL_RUNTIME_PASSWORD: ${APPSELL_RUNTIME_PASSWORD:?set in local env}
    ports:
      - "127.0.0.1:${APPSELL_POSTGRES_PORT:-55432}:5432"
    volumes:
      - appsell_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appsell"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

volumes:
  appsell_postgres_data:
